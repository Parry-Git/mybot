[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "mybot-voice"
version = "0.4.0"
description = "Local streaming ASR/TTS and a remote LLM for an RTX 4060 voice assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "qwen-asr[vllm]==0.0.6",
    "realtimetts[qwen]==0.8.5",
    "realtimetts-qwen-native==0.2.0",
    "numpy>=1.26,<2.3",
    "librosa>=0.11,<1",
    "openai>=1.99.1,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "sounddevice>=0.5.3,<1",
    "webrtcvad-wheels>=2.0.14,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
browser = ["playwright>=1.50,<2", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
"core.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Directly runnable scripts add the checkout root before importing core.
"scripts/*.py" = ["E402"]
"tests/integration/*.py" = ["E402"]
